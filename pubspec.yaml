name: dojo_sensei
description: "Aplicativo de gestão e controle de presença para dojo e artes marciais."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Ícones padrão do iOS / Material
  cupertino_icons: ^1.0.8

  # Pacote para selecionar imagens da galeria do dispositivo (PNG, JPEG, etc.)
  image_picker: ^1.0.7

  # Pacote para salvar as configurações locais e o Base64 da logo
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Definição dos assets padrão (se houver imagens ou ícones locais)
  # assets:
  #   - assets/images/